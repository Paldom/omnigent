# Card timings are aligned to the mockup's measured beat timeline:
#   demo t0 at the mic click; beats at 1.3 / 8.9 / 15.8 / 24.0 / 35.6 / 48.0s.
schema: 1
name: omnigent-voice-mode
url: http://localhost:8899/?static=1
viewport: { width: 1440, height: 900 }
theme: glass
output:
  fps: 30
  gif: { width: 1000, fps: 12 }

steps:
  - card:
      style: hero
      title: "Voice mode"
      body: "Address any session by name and tell it what to do — without touching the keyboard, and without leaving the one you're reading."
      duration: 3.4

  - ring: "#micBtn"
  - move: { to: "#micBtn", duration: 0.8 }
  - card:
      title: "Nothing new to install"
      body: "The composer mic already streams 16 kHz audio to /v1/dictation/stream. Speech out is the same registry, on a dependency omnigent already ships."
      at: "#micBtn"
      side: top
      duration: 3.6
  - click: "#micBtn"
  - ring: hide

  # ── beat 1 · address + dictate ──────────────────────────────────────────
  - wait: 1.4
  - card:
      title: "You speak first"
      body: "A callsign binds the session, then the rest of the sentence is the instruction. It lands as an ordinary turn — the same one you'd have typed."
      at: ".hudcard"
      side: top
      duration: 4.0
  - zoom: { to: ".hudcard", scale: 1.28, duration: 1.0 }
  - card:
      title: "Dictation, where it pays"
      body: "Prompts are paragraphs now. Speaking one beats typing it."
      at: ".hudcard"
      side: right
      duration: 2.2
  - zoom: { reset: true, duration: 0.9 }

  # ── beat 2 · query the fleet ────────────────────────────────────────────
  - card:
      title: "Ask the fleet a question"
      body: "“Who's idle?” is a question, not a dashboard scan. Twenty sessions answer in one sentence."
      at: ".hudcard"
      side: top
      duration: 4.0

  # ── beat 3 · reach a session you aren't in ──────────────────────────────
  - wait: 2.4
  - card:
      title: "Reach a session you aren't in"
      body: "The screen never left deploy. Voice addresses auth directly — no navigation, no lost place, no context switch."
      at: ".hudcard"
      side: top
      duration: 4.0
  - move: { to: "[data-vt='2']", duration: 0.8 }
  - card:
      title: "It shows you where it went"
      body: "The addressed session rings in the sidebar, so a wrong callsign is visible before it matters."
      at: "[data-vt='2']"
      side: right
      duration: 3.0

  # ── beat 4 · attend mode, a reversible gate ─────────────────────────────
  - move: { to: [1180, 260], duration: 0.8 }
  - card:
      title: "And it can speak first"
      body: "Opt-in, and only on state change — a gate opened, a run failed. Never progress narration. That is how a voice feature survives past day two."
      at: ".hudcard"
      side: top
      duration: 4.2
  - zoom: { to: ".hudcard", scale: 1.26, duration: 1.0 }
  - card:
      title: "Callsigns, and a check token"
      body: "“auth-bug-2” is the proper noun ASR mangles, so sessions get a phonetic callsign fed to the recognizer as a hotword. And the reply is “allow bravo”, not “yes” — a podcast can't produce that."
      at: ".hudcard"
      side: right
      duration: 4.2
  - zoom: { reset: true, duration: 0.9 }

  # ── beat 5 · the line ───────────────────────────────────────────────────
  - wait: 1.2
  - move: { to: "#submitBtn", ax: 0.5, ay: -1.4, duration: 0.8 }
  - card:
      title: "And here it refuses"
      body: "A production deploy is not answerable by voice at all. Unconfirmed speech recognition is not an authorization primitive."
      at: ".hudcard"
      side: top
      duration: 4.0
  - card:
      title: "Voice requests. A click commits."
      body: "Voice can surface it, defer it, and deny it — denial is always safe. The accept path for the top risk tier stays on the screen."
      at: ".hudcard"
      side: right
      duration: 4.0
  - card:
      title: "Staged, waiting for you"
      body: "The gate is still open and the button is still yours. Nothing shipped because someone said “yeah” in the next room."
      at: "#submitBtn"
      side: right
      duration: 3.0

  # ── beat 6 · read back ──────────────────────────────────────────────────
  - move: { to: [1180, 300], duration: 0.8 }
  - card:
      title: "Read it back"
      body: "Eyes on a terminal, hands on the keyboard, and the answer still arrives. This is the same feature a screen-reader user has been asking for."
      at: ".hudcard"
      side: top
      duration: 4.0

  - card:
      style: hero
      title: "Eyes available, never eyes required"
      body: "Every flow completes through audio. The screen mirrors each step so you can verify at the desk — and never has to be looked at to be safe."
      duration: 3.4
